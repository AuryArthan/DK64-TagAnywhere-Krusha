name: Publish v0.4.2 BPS
on:
  push:
    paths:
      - 'release-assets/v0.4.2/**'
      - 'tools/publish-v042.py'
      - '.github/workflows/release-v042.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-v042
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'AuryArthan/DK64-TagAnywhere-Krusha-code'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate and publish the approved patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish-v042.py
